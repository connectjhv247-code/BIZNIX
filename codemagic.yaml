workflows:
  biznix-aab:
    name: BIZNIX AAB
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
    scripts:
      - npm install
      - npm run build
      - npx cap sync android
      - cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
