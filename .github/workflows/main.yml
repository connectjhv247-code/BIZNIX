name: Build BIZNIX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Android
        run: |
          if [ -d node_modules/@capacitor/core ]; then
            V=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
            npm install --no-save --legacy-peer-deps @capacitor/android@$V
          else
            npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap copy android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          MAJOR=$(node -p "require('../node_modules/@capacitor/core/package.json').version.split('.')[0]")
          if [ "$MAJOR" -ge 7 ]; then
            export JAVA_HOME=$JAVA_HOME_21_X64
          else
            export JAVA_HOME=$JAVA_HOME_17_X64
          fi
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BIZNIX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
