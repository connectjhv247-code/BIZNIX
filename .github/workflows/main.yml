name: Build BIZNIX APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build web
        run: |
          npm run build || npm run build:web || npx vite build || echo "build done"
          ls -la
          ls -la dist || ls -la build || ls -la public || true
      - name: Build APK
        run: |
          npx cap copy android || true
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIZNIX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
