name: Build BIZNIX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Android
        run: |
          if [ -d node_modules/@capacitor/core ]; then
            V=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
            npm install --no-save --legacy-peer-deps @capacitor/android@$V
          else
            npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap copy android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIZNIX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error