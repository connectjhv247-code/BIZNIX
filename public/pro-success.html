<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BIZNIX Pro — Activation Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060D19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #09182C;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(212, 175, 55, 0.2);
      border-radius: 24px;
      padding: 40px 24px;
      max-width: 450px;
      width: 100%;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #D4AF37;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 12px;
      line-height: 1.35;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status-box {
      background: #050C17;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #38BDF8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, #D4AF37 0%, #F59E0B 100%);
      color: #060D19;
      font-weight: 800;
      font-size: 15px;
      border-radius: 16px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .ref-tag {
      margin-top: 18px;
      font-size: 11px;
      font-family: monospace;
      color: #64748B;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div class="badge">⭐ BIZNIX Pro</div>
    <h2 id="heading">Your BIZNIX features has successfully active!</h2>
    <p id="sub-msg">Activating Pro and returning to your BIZNIX app...</p>

    <div class="status-box" id="status-box">
      <div class="spinner" id="spinner"></div>
      <span id="status-text">Opening BIZNIX app...</span>
    </div>

    <a href="#" id="open-btn" class="btn">Tap to Open BIZNIX App</a>

    <div class="ref-tag" id="ref-display"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference') || params.get('trxref') || '';
    const storedEmail = localStorage.getItem('biznix_email') || '';

    // The primary BIZNIX production/preview backend host
    const PRIMARY_BACKEND = 'https://ais-pre-o3m37bvc32boihy5xq4zxf-468761680881.europe-west3.run.app';
    const currentOrigin = window.location.origin || '';
    const isStandaloneHost = currentOrigin.includes('netlify') || currentOrigin.includes('vercel') || currentOrigin.includes('github.io');
    const API_HOST = isStandaloneHost ? PRIMARY_BACKEND : (currentOrigin || PRIMARY_BACKEND);

    const deepLinkUrl = `biznix://pro-success?reference=${encodeURIComponent(reference)}`;
    const openBtn = document.getElementById('open-btn');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');
    const refDisplay = document.getElementById('ref-display');
    const subMsg = document.getElementById('sub-msg');

    if (reference) {
      refDisplay.textContent = `Transaction Reference: ${reference}`;
    }

    openBtn.href = deepLinkUrl;
    openBtn.onclick = function(e) {
      window.location.href = deepLinkUrl;
    };

    // 1. Try to open app via deep link (1s)
    setTimeout(() => {
      window.location.href = deepLinkUrl;
    }, 1000);

    // 2. Fallback - after 3 seconds, verify via API directly from this page
    setTimeout(async () => {
      if (reference) {
        statusText.textContent = 'Verifying Paystack payment server-side...';
        try {
          const res = await fetch(`${API_HOST}/api/verifyPaystack`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              reference: reference, 
              email: storedEmail 
            })
          });

          const data = await res.json();
          if (spinner) spinner.style.display = 'none';

          if (data && (data.success || data.is_pro || data.isPro)) {
            statusText.textContent = 'Pro entitlement verified and active!';
            subMsg.innerHTML = '<strong>Pro Activated!</strong> Go back to BIZNIX app, or tap the button below.';
          } else {
            statusText.textContent = 'Payment received. Tap below to launch BIZNIX.';
          }
        } catch (err) {
          if (spinner) spinner.style.display = 'none';
          statusText.textContent = 'Payment recorded! Tap below to open BIZNIX.';
        }
      }
    }, 3000);
  </script>
</body>
</html>
