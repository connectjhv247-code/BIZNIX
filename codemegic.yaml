workflows:
  android-build:
    name: BIZNIX Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.18.1
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
